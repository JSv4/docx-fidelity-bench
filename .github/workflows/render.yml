name: Measure Docxodus against LibreOffice
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact Docxodus commit
        required: true
        default: '6e0e6ca34407b2e805b5d784cb58a23d15e45853'
        type: string
      reference_run:
        description: Optional earlier run whose immutable reference bundle, calibration, and candidate result are reused and compared
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BENCH_LIBREOFFICE: /opt/libreoffice25.8/program/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit original inputs
        run: |
          python3 -m bench.audit
          python3 -m unittest discover -s tests
          node --test tests/test-adapter.mjs
          mkdir -p runs
          echo '<!doctype html><title>Rendering evidence</title><p>Setup is pending or failed.</p><p><a href="candidate/index.html">Candidate report if available</a></p>' > runs/index.html
      - name: Checkout pinned renderer production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JSv4/Docxodus
          ref: ${{ inputs.candidate }}
          path: renderer
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /Docxodus/
            /wasm/
            /scripts/
            /npm/
            /npm-export/
            /docs/schemas/
            !/npm/tests/
            !/npm-export/tests/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Provision external measurement utilities and open fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils qpdf fontconfig fonts-liberation2
          dotnet workload install wasm-tools
      - name: Install signed LibreOffice 25.8.7.3 reference runtime
        if: ${{ inputs.reference_run == '' }}
        run: |
          install_dir="$RUNNER_TEMP/lo-reference-install"
          mkdir -p "$install_dir"
          archive_url='https://downloadarchive.documentfoundation.org/libreoffice/old/25.8.7.3/deb/x86_64/LibreOffice_25.8.7.3_Linux_x86-64_deb.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 "$archive_url" -o "$install_dir/runtime.tar.gz"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 "$archive_url.asc" -o "$install_dir/runtime.asc"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3' -o "$install_dir/signing-key.asc"
          mkdir "$install_dir/keyring"
          chmod 700 "$install_dir/keyring"
          gpg --homedir "$install_dir/keyring" --batch --import "$install_dir/signing-key.asc"
          fingerprint=$(gpg --homedir "$install_dir/keyring" --with-colons --fingerprint C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3 | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 'C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3'
          gpg --homedir "$install_dir/keyring" --batch --verify "$install_dir/runtime.asc" "$install_dir/runtime.tar.gz"
          tar -xzf "$install_dir/runtime.tar.gz" -C "$install_dir"
          sudo dpkg -i "$install_dir"/LibreOffice_*/DEBS/*.deb
          sudo find /opt/libreoffice25.8/share/fonts -type f -iname '*.ttf' -delete
          "$BENCH_LIBREOFFICE" --version
      - name: Build exact production export runtime
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: python3 -m bench build-docxodus --source renderer --commit "$CANDIDATE_COMMIT"
      - name: Verify installed observer browser API
        run: DOCXODUS_SOURCE_ROOT="$PWD/renderer" node --test tests/test-playwright-runtime.mjs
      - name: Provision Chromium sandbox host
        run: |
          npm --prefix renderer/npm exec -- playwright install --with-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Register immutable LibreOffice reference bundles
        if: ${{ inputs.reference_run == '' }}
        run: |
          python3 -m bench reference libreoffice --out references/lo-direct
          python3 -m bench reference equivalent-controls --reference references/lo-direct/bundle.json --out references/lo
      - name: Reuse the registered reference bundle and its calibration
        if: ${{ inputs.reference_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUN: ${{ inputs.reference_run }}
        run: |
          gh run download "$REFERENCE_RUN" --repo "$GITHUB_REPOSITORY" --name rendering-evidence --dir recovered
          cp -a recovered/references/. references/
          mkdir -p runs
          cp -a recovered/runs/calibration runs/calibration
          cp recovered/runs/candidate/result.json runs/baseline-result.json
          python3 - <<'PYCODE'
          from bench.common import read_json, identity, validate_registry
          from bench.environment import environment
          from bench import runner
          registry = validate_registry()
          env = environment([f for c in registry['cases'] for f in c['fonts']])
          bundle = read_json('references/lo/bundle.json')
          runner.validate_bundle(bundle, __import__('pathlib').Path('references/lo').resolve(), registry, env)
          calibration = read_json('runs/calibration/result.json')
          assert calibration['contract']['referenceDigest'] == identity(bundle)
          assert calibration['contract']['suiteDigest'] == identity(registry)
          assert calibration['contract']['environment'] == env['contract']
          assert calibration['summary']['complete'] and calibration['summary']['score'] == 100, calibration['summary']
          print('Reusing reference bundle', identity(bundle), 'with its 100-point calibration')
          PYCODE
      - name: Verify reference-provider calibration
        if: ${{ inputs.reference_run == '' }}
        run: |
          python3 -m bench run --reference references/lo/bundle.json --adapter libreoffice-reference --candidate reference-calibration --out runs/calibration --gate close
          python3 -c 'import json; r=json.load(open("runs/calibration/result.json")); assert r["summary"]["score"] == 100, r["summary"]'
      - name: Measure delivered candidate PDFs
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: |
          export DOCXODUS_SOURCE_ROOT="$PWD/renderer"
          export DOCXODUS_EXPORT_MODULE="$PWD/renderer/npm-export/dist/index.js"
          python3 -m bench run --reference references/lo/bundle.json --adapter docxodus --candidate "$CANDIDATE_COMMIT" --out runs/candidate --gate report
      - name: Compare with the reused run's candidate
        if: ${{ inputs.reference_run != '' }}
        run: |
          # Report-only: every remaining mandatory failure is listed, including ones the baseline shares.
          status=0
          python3 -m bench compare runs/baseline-result.json runs/candidate/result.json --tolerance 0 > runs/compare.txt || status=$?
          cat runs/compare.txt
          echo "compare exit status $status (report-only)"
      - name: Preserve reports and exact reference bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rendering-evidence
          path: |
            runs/
            references/
          retention-days: 30
          if-no-files-found: error
  redline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_LIBREOFFICE: /opt/libreoffice25.8/program/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate the redline corpus
        run: |
          python3 -m bench redline validate
          python3 -m unittest discover -s tests -p test_redline.py
          mkdir -p runs
      - name: Checkout pinned comparison library source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JSv4/Docxodus
          ref: ${{ inputs.candidate }}
          path: renderer
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /Docxodus/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Install signed LibreOffice 25.8.7.3 revision engine
        run: |
          # The distribution package supplies runtime dependencies and a UNO-capable fallback Python.
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno
          install_dir="$RUNNER_TEMP/lo-redline-install"
          mkdir -p "$install_dir"
          archive_url='https://downloadarchive.documentfoundation.org/libreoffice/old/25.8.7.3/deb/x86_64/LibreOffice_25.8.7.3_Linux_x86-64_deb.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 "$archive_url" -o "$install_dir/runtime.tar.gz"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 "$archive_url.asc" -o "$install_dir/runtime.asc"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3' -o "$install_dir/signing-key.asc"
          mkdir "$install_dir/keyring"
          chmod 700 "$install_dir/keyring"
          gpg --homedir "$install_dir/keyring" --batch --import "$install_dir/signing-key.asc"
          fingerprint=$(gpg --homedir "$install_dir/keyring" --with-colons --fingerprint C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3 | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 'C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3'
          gpg --homedir "$install_dir/keyring" --batch --verify "$install_dir/runtime.asc" "$install_dir/runtime.tar.gz"
          tar -xzf "$install_dir/runtime.tar.gz" -C "$install_dir"
          sudo dpkg -i "$install_dir"/LibreOffice_*/DEBS/*.deb
          "$BENCH_LIBREOFFICE" --version
          ls -l /opt/libreoffice25.8/program/python* || true
      - name: Build the validator and the source-bound comparison adapter
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: |
          python3 -m bench redline build-validator --out "$RUNNER_TEMP/validator"
          python3 -m bench redline build-docxodus --source renderer --commit "$CANDIDATE_COMMIT" --out "$RUNNER_TEMP/adapter"
      - name: Calibrate with the authored redlines
        run: python3 -m bench redline run --adapter authored --candidate authored-calibration --validator "$RUNNER_TEMP/validator" --out runs/redline-calibration --gate pass
      - name: Measure the candidate's redlines
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: python3 -m bench redline run --adapter docxodus --candidate "$CANDIDATE_COMMIT" --build "$RUNNER_TEMP/adapter" --validator "$RUNNER_TEMP/validator" --out runs/redline --gate report
      - name: Preserve redline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: redline-evidence
          path: runs/
          retention-days: 30
          if-no-files-found: warn
