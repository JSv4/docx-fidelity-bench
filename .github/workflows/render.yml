name: Measure Docxodus against LibreOffice
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact Docxodus commit
        required: true
        default: 'a56b4484384770a1b30a8680179667afec4523d5'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BENCH_LIBREOFFICE: /opt/libreoffice25.8/program/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit original inputs
        run: |
          python3 -m bench.audit
          python3 -m unittest discover -s tests
          node --test tests/test-adapter.mjs
          mkdir -p runs
          echo '<!doctype html><title>Rendering evidence</title><p>Setup is pending or failed.</p><p><a href="candidate/index.html">Candidate report if available</a></p>' > runs/index.html
      - name: Checkout pinned renderer production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JSv4/Docxodus
          ref: ${{ inputs.candidate }}
          path: renderer
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /Docxodus/
            /wasm/
            /scripts/
            /npm/
            /npm-export/
            /docs/schemas/
            !/npm/tests/
            !/npm-export/tests/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Provision external measurement utilities and open fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils qpdf fontconfig fonts-liberation2
          dotnet workload install wasm-tools
      - name: Install signed LibreOffice 25.8.7.3 reference runtime
        run: |
          install_dir="$RUNNER_TEMP/lo-reference-install"
          mkdir -p "$install_dir"
          archive_url='https://downloadarchive.documentfoundation.org/libreoffice/old/25.8.7.3/deb/x86_64/LibreOffice_25.8.7.3_Linux_x86-64_deb.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 "$archive_url" -o "$install_dir/runtime.tar.gz"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 "$archive_url.asc" -o "$install_dir/runtime.asc"
          curl --fail --location --retry 5 --proto '=https' --tlsv1.2 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3' -o "$install_dir/signing-key.asc"
          mkdir "$install_dir/keyring"
          chmod 700 "$install_dir/keyring"
          gpg --homedir "$install_dir/keyring" --batch --import "$install_dir/signing-key.asc"
          fingerprint=$(gpg --homedir "$install_dir/keyring" --with-colons --fingerprint C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3 | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 'C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3'
          gpg --homedir "$install_dir/keyring" --batch --verify "$install_dir/runtime.asc" "$install_dir/runtime.tar.gz"
          tar -xzf "$install_dir/runtime.tar.gz" -C "$install_dir"
          sudo dpkg -i "$install_dir"/LibreOffice_*/DEBS/*.deb
          sudo find /opt/libreoffice25.8/share/fonts -type f -iname '*.ttf' -delete
          "$BENCH_LIBREOFFICE" --version
      - name: Recover immutable reference and complete calibration evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38492946860 --repo JSv4/docx-fidelity-bench --name rendering-evidence --dir references/recovered
          cp -a references/recovered/references/. references/
          cp -a references/recovered/runs/calibration runs/calibration
      - name: Verify reference repeatability and expose its declaration failure
        run: |
          python3 - <<'PYCODE'
          from bench.common import read_json, identity, validate_registry, write_json
          from bench.environment import environment
          registry = validate_registry()
          calibration = read_json('runs/calibration/result.json')
          bundle = read_json('references/lo/bundle.json')
          assert calibration['summary']['complete'] and calibration['summary']['measured'] == 85
          assert calibration['contract']['suiteDigest'] == identity(registry)
          assert calibration['contract']['referenceDigest'] == identity(bundle)
          assert calibration['contract']['environment'] == environment([f for c in registry['cases'] for f in c['fonts']])['contract']
          assert all(page['score'] == 100 and page['raster']['referenceSha256'] == page['raster']['candidateSha256'] for case in calibration['cases'] for page in case['pages'])
          failures = [(case['id'], check['name']) for case in calibration['cases'] for check in case['checks'] if not check['passed']]
          assert failures == [('tables-vmerge-boundary-merged', 'assertion-same-page')], failures
          write_json('runs/calibration-validation.json', {'rasterRepeatability': '100 on all 85 cases', 'referenceAssertionFailures': failures, 'sourceRun': 38492946860})
          print('85/85 raster repeats are byte-identical. The boundary-merge reference violates its declared same-page assertion; preserve this defect in the candidate measurement.')
          PYCODE
      - name: Build exact production export runtime
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: python3 -m bench build-docxodus --source renderer --commit "$CANDIDATE_COMMIT"
      - name: Provision Chromium sandbox host
        run: |
          npm --prefix renderer/npm exec -- playwright install --with-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Measure delivered candidate PDFs
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: |
          export DOCXODUS_SOURCE_ROOT="$PWD/renderer"
          export DOCXODUS_EXPORT_MODULE="$PWD/renderer/npm-export/dist/index.js"
          python3 -m bench run --reference references/lo/bundle.json --adapter docxodus --candidate "$CANDIDATE_COMMIT" --out runs/candidate --gate report
      - name: Capture causal HTML and PageMap diagnostics
        if: ${{ !cancelled() }}
        run: |
          test -f runs/candidate/result.json || exit 0
          python3 - <<'PYCODE'
          from bench.common import write_json, validate_registry
          from bench.environment import environment
          write_json('runs/diagnostic-fonts.json', environment([f for c in validate_registry()['cases'] for f in c['fonts']])['fontDirectories'])
          PYCODE
          node --input-type=module - <<'JSCODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { renderDocxArtifacts } from './renderer/npm-export/dist/index.js';
          const registry = JSON.parse(await readFile('fixtures/manifest.json','utf8'));
          const result = JSON.parse(await readFile('runs/candidate/result.json','utf8'));
          const fontDirectories = JSON.parse(await readFile('runs/diagnostic-fonts.json','utf8'));
          const controls = ['paragraph-contract','paragraph-heading','paragraph-keep','notes-footnote','notes-endnote','images-square','images-tight','tables-nested','tables-margins','paragraphs-inline-control'];
          const selected = result.cases.filter(c => !(c.score >= 95) || controls.includes(c.id));
          for (const outcome of selected) {
            const fixture = registry.cases.find(c => c.id === outcome.id);
            const folder = resolve('runs/diagnostics',outcome.id);
            await mkdir(folder,{recursive:true});
            try {
              const artifacts = await renderDocxArtifacts(new Uint8Array(await readFile(fixture.input)), {outputs:['html','pdf'],reviewProfile:fixture.profile.review,commentProfile:fixture.profile.comments,fontDirectories,strictFonts:true,timeoutMs:120000});
              await writeFile(resolve(folder,'candidate.html'),artifacts.html);
              await writeFile(resolve(folder,'candidate.pdf'),artifacts.pdf);
              await writeFile(resolve(folder,'pageMap.json'),JSON.stringify(artifacts.pageMap,null,2));
              await writeFile(resolve(folder,'production.json'),JSON.stringify(artifacts.renderReport,null,2));
              console.log(outcome.id+': diagnostics captured');
            } catch(error) {
              await writeFile(resolve(folder,'failure.json'),JSON.stringify(error.toJSON?.() ?? {message:error.message,code:error.code,phase:error.phase},null,2));
              console.log(outcome.id+': '+error.code+' '+error.phase);
            }
          }
          JSCODE
      - name: Preserve reports and exact reference bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rendering-evidence
          path: |
            runs/
            references/
          retention-days: 30
          if-no-files-found: error
