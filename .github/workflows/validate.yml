name: Validate authored benchmark
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Provision native PDF contract checks
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Validate manifests and original inventory
        run: |
          python3 -m bench validate
          python3 -m bench redline validate
          python3 -m bench.audit
      - name: Exercise scoring and failure contracts
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test-adapter.mjs
